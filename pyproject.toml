[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "embedder"
version = "1.0.2"
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.0.6"
]

[tool.setuptools]
packages = ["embedder"]

[tool.setuptools.package-dir]
"embedder" = "src"