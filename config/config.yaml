logger:
  folder: "./data/logs/"
  file_name: "output.log"
  header_char: "-"
  header_length: 60
  log_runtime: True
  format: "%Y-%m-%d %H:%M:%S"
  encoding: "utf-8"
embedder: 
  model_id:
    - "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
  revision:
    "cambridgeltl/SapBERT-from-PubMedBERT-fulltext": "090663c3ae57bf35ffe4d0d468a2a88d03051a4d"
  pooling: "mean"
  cache_folder: "./data/cache/embeddings/"
  progress_interval: 10000
  num_threads: null
  device: "cpu"
  batch_size: 128
  max_seq_length: 128
  normalization: True
  dimensionality_reduction: True
  n_components: 2
  n_neighbors: 25
  min_dist: 0.2
  metric: "cosine"
  random_state: 253
