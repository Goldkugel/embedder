# Runs the Embedder test suite on every push and pull request.
#
# The package is installed from the checkout (not in editable mode), so the
# run also checks that pyproject.toml declares all runtime dependencies.
# PyTorch is installed from its CPU-only index first: the default PyPI wheel
# bundles CUDA libraries (several GB) that the CPU-only runners never use.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Pinned instead of ubuntu-latest, as in the logger repository, so the
    # set of available Python builds does not change underneath the matrix.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python), the version used by the
        # pipeline (3.11) and the newest version.
        python-version: ["3.10", "3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test]"

      - name: Run fast tests (mocked models)
        run: python -m pytest tests/EmbedderTest.py -v

  smoke:
    # Runs the slow test once, against a real model and real UMAP, to catch
    # API changes in sentence-transformers or umap-learn.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The smoke test's model ID and pinned revision live in the test file,
      # so the downloaded model is only re-fetched when that file changes.
      - name: Cache downloaded Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('tests/EmbedderTest.py') }}

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test]"

      - name: Run real-model smoke test
        run: python -m pytest tests/EmbedderTest.py -v -m slow
